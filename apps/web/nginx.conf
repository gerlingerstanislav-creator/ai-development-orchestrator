server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Codex test calls may take up to 120s; the API allows 125s.
    # Keep Nginx's upstream read timeout longer so the API can return
    # the actual Codex result/error instead of a premature 504.
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
  }
  location / { try_files $uri $uri/ /index.html; }
}