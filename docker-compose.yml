services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: orchestrator
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://orchestrator:${POSTGRES_PASSWORD}@db:5432/orchestrator
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?set CREDENTIALS_KEY}
      PORT: 3001
      CODEX_RUNNER_URL: http://codex:4300
      AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-false}
      RUNNER_SHARED_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      db: {condition: service_healthy}
  temporal:
    image: temporalio/temporal:1.10.0
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    volumes:
      - temporal_data:/home/temporal
    restart: unless-stopped
    # Development service with persistent SQLite. Keep Web UI private.
    # Expose explicitly only on a trusted host if needed: 127.0.0.1:8233:8233
  temporal-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "worker", "-w", "apps/api"]
    environment:
      DATABASE_URL: postgres://orchestrator:${POSTGRES_PASSWORD}@db:5432/orchestrator
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?set CREDENTIALS_KEY}
      CODEX_RUNNER_URL: http://codex:4300
      RUNNER_SHARED_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      db: {condition: service_healthy}
      temporal: {condition: service_started}
      codex: {condition: service_started}
    restart: unless-stopped
  codex:
    build:
      context: .
      dockerfile: apps/codex-runner/Dockerfile
    init: true
    # Docker is the security boundary for Codex when nested Linux sandboxing
    # is unsupported. Run as unprivileged node and drop Linux capabilities.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      CODEX_HOME: /home/node/.codex
      RUNNER_SHARED_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADO_AGENT_API_URL: http://api:3001/internal/agent-tools
    volumes:
      - codex_auth:/home/node/.codex
    restart: unless-stopped
    # Internal only: no host port. Never mount the Docker socket here.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]
volumes:
  db_data:
  codex_auth:
  temporal_data:
