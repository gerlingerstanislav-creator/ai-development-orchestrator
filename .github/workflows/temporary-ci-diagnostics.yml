name: Temporary CI diagnostics
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.head_ref == 'fix/agent-owned-documentation-structure-20261110'
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.capture.outputs.phase }}
      reason: ${{ steps.capture.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture first failed operation
        id: capture
        shell: bash
        run: |
          set +e
          phase=install
          npm install --no-audit --no-fund > diagnostic.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            phase=check
            npm run check > diagnostic.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            phase=build
            npm run build > diagnostic.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            phase=tests
            node --test apps/api/tests/*.test.mjs > diagnostic.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            reason=SUCCESS
          else
            reason=$(grep -E 'error TS[0-9]+|npm error|^Error:|^not ok|FAIL|Cannot find module|ENOENT|EACCES|failed' diagnostic.log | head -1 | cut -c 1-100)
            if [ -z "$reason" ]; then reason=$(tail -1 diagnostic.log | cut -c 1-100); fi
          fi
          reason=$(echo "$reason" | tr -cd '[:print:]' | cut -c 1-100)
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "reason=$reason (exit=$code)" >> "$GITHUB_OUTPUT"
  report:
    needs: diagnose
    if: always()
    runs-on: ubuntu-latest
    name: "${{ needs.diagnose.outputs.phase }} :: ${{ needs.diagnose.outputs.reason }}"
    steps:
      - run: echo "Diagnostic result is reflected in job name"
