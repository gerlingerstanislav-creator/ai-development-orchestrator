name: Build and typecheck
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: node --check apps/codex-runner/server.mjs
      - run: node --test apps/api/tests/agent-mentions.test.mjs
