name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator_ci
          POSTGRES_DB: orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://orchestrator:orchestrator_ci@localhost:5432/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript checks
        run: npm run check
      - name: Architecture boundaries and ESLint
        run: npm run check:architecture && npm run lint
      - name: Build frontend and backend
        run: npm run build
      - name: Full backend, Runner and web regression tests
        run: |
          node --check apps/codex-runner/server.mjs
          node --check apps/codex-runner/qa-job.mjs
          node --test apps/codex-runner/qa-job.test.mjs
          node --check apps/codex-runner/delegated-work-sandbox.mjs
          node --test apps/codex-runner/delegated-work-sandbox.test.mjs
          node --check apps/codex-runner/ci-test-discovery.mjs
          node --check apps/codex-runner/ci-job.mjs
          node --check apps/codex-runner/task-pull-request.mjs
          node --test apps/codex-runner/task-pull-request.test.mjs
          node --check apps/codex-runner/development-job.mjs
          node --test apps/codex-runner/development-job.test.mjs
          node --test apps/codex-runner/ci-job.test.mjs
          node --check apps/codex-runner/command-executor.mjs
          node --check apps/codex-runner/codex-app-server.mjs
          node --check apps/codex-runner/codex-cli-session.mjs
          node --check apps/codex-runner/codex-thread-scope.mjs
          node --test apps/codex-runner/codex-app-server.test.mjs apps/codex-runner/codex-cli-session.test.mjs
          node --check apps/codex-runner/codex-proxy.mjs
          node --test apps/codex-runner/codex-proxy.test.mjs
          node --check apps/codex-runner/device-auth.mjs
          node --test apps/codex-runner/device-auth.test.mjs
          node --check apps/codex-runner/request-contracts.mjs
          node --test apps/codex-runner/request-contracts.test.mjs
          node --test apps/codex-runner/command-executor.test.mjs
          node --test apps/codex-runner/ci-test-discovery.test.mjs
          node --check apps/codex-runner/browser-client.mjs
          node --check apps/codex-runner/browser-gateway.mjs
          node --check apps/codex-runner/qa-completion.mjs
          node --check apps/codex-runner/qa-prompt.mjs
          node --check apps/codex-runner/developer-prompt.mjs
          node --check apps/api/dist/prompt-assembler.mjs
          node --check apps/qa-browser/server.mjs
          node --check apps/qa-browser/browser-smoke.mjs
          node --test apps/codex-runner/job-scheduler.test.mjs apps/codex-runner/agent-context.test.mjs apps/codex-runner/browser-gateway.test.mjs apps/codex-runner/development-outcome.test.mjs apps/codex-runner/qa-run-evidence.test.mjs apps/codex-runner/qa-completion.test.mjs apps/codex-runner/prompt-assembler.test.mjs apps/codex-runner/task-branch-history.test.mjs
          # All API suites, including newly added ones, run sequentially to prevent PostgreSQL fixture races.
          node --test --test-concurrency=1 apps/api/tests/*.test.mjs
          node --import tsx --test apps/web/tests/api-client.test.mjs
          node --import tsx --test apps/web/tests/feature-boundaries.test.mjs
          node --import tsx --test apps/web/tests/project-sidebar.test.mjs
          node --import tsx --test apps/web/tests/project-list-page.test.mjs
          node --import tsx --test apps/web/tests/task-timeline.test.mjs
          node --import tsx --test apps/web/tests/kanban-board.test.mjs
          node --import tsx --test apps/web/tests/task-live-state.test.mjs
          node --import tsx --test apps/web/tests/process-center.test.mjs

  temporal-runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build the actual workflow bundle
        run: npm run build -w apps/api
      - name: Start real Temporal development service
        run: |
          docker run --detach --name ado-temporal-integration --publish 127.0.0.1:7233:7233 \
            temporalio/temporal:1.10.0 server start-dev --ip 0.0.0.0
          for i in $(seq 1 80); do
            if node -e "const s=require('node:net').connect({host:'127.0.0.1',port:7233});s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),1500)" ; then
              exit 0
            fi
            sleep 2
          done
          docker logs ado-temporal-integration
          exit 1
      - name: Real Temporal worker and pipeline integration tests
        env:
          TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: node --check apps/api/tests/temporal-runtime.integration.mjs && node --test apps/api/tests/temporal-runtime.integration.mjs
      - name: Temporal diagnostics
        if: failure()
        run: docker logs --tail 150 ado-temporal-integration || true
      - name: Stop isolated Temporal test service
        if: always()
        run: docker rm -f ado-temporal-integration || true

  codex-runner-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose dependencies and healthchecks
        env:
          POSTGRES_PASSWORD: ci_database_password
          ADMIN_EMAIL: ci@example.test
          ADMIN_PASSWORD: ci_admin_password
          JWT_SECRET: ci_jwt_password
          CREDENTIALS_KEY: ci_credential_password
          RUNNER_SHARED_SECRET: 0123456789abcdef0123456789abcdef
        run: docker compose config --quiet
      - name: Build the actual Codex Runner image
        run: docker build -f apps/codex-runner/Dockerfile -t ado-codex-runner-ci .
      - name: Verify imports and authenticated HTTP readiness inside the built image
        run: |
          docker run --rm --network none \
            -e RUNNER_SHARED_SECRET=0123456789abcdef0123456789abcdef \
            --entrypoint node ado-codex-runner-ci /opt/codex-runner/startup-smoke.mjs

  qa-browser-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci_database_password
      ADMIN_EMAIL: ci@example.test
      ADMIN_PASSWORD: ci_admin_password
      JWT_SECRET: ci_jwt_password
      CREDENTIALS_KEY: ci_credential_password
      RUNNER_SHARED_SECRET: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Build production Runner and isolated Chromium images
        run: docker compose build codex qa-browser
      - name: Start isolated Chromium in the real Compose network
        run: docker compose up -d --no-deps qa-browser
      - name: Verify real sandbox -> loopback gateway -> Chromium assertion
        run: docker compose run --rm --no-deps --entrypoint node codex /opt/codex-runner/browser-smoke.mjs
      - name: Browser diagnostics after failure
        if: failure()
        run: docker compose logs --no-color qa-browser
      - name: Stop services and clear test workspaces
        if: always()
        run: docker compose down -v --remove-orphans

  qa-browser-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build actual isolated Chromium QA image
        run: docker build -f apps/qa-browser/Dockerfile -t ado-qa-browser-ci .
      - name: Open and verify standalone HTML in real Chromium without network
        run: |
          docker run --rm --network none --shm-size=512m \
            -e QA_WORKSPACES_DIR=/tmp/ado-qa-workspaces \
            --entrypoint node ado-qa-browser-ci /opt/qa-browser/browser-smoke.mjs
